openapi: 3.0.3
info:
  title: Github Search API
  version: v1.0.0
  description: Github Search API
servers:
  - url: http://localhost:8000
    description: Local dev
paths:
  /api/search:
    post:
      operationId: search
      parameters:
        - in: query
          name: search_type
          schema:
            type: string
            enum:
              - users
              - repositories
              - issues
          required: true
          description: |
            Search type
      tags:
        - Search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResponse'
components:
  schemas:
    SearchRequest:
      type: object
      properties:
        search_text:
          type: string
      required:
        - search_text
    SearchResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        avatar_url:
          type: string
        location:
          type: string
          nullable: true
      required:
        - id
        - title
        - avatar_url
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
